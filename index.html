<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>C-Layer Bench 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* A working bench: the 3D model on top, its instruments, cycle, sealed records and the judges' demo below. */
:root{--page:#f2f2ef;--ink:#57575a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0b0b0b;--ink:#a3a3a3;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0b0b0b;--ink:#a3a3a3;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.6 "IBM Plex Sans Arabic","Noto Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:32px 64px}
.iso{background:var(--page);--cl-line:#dcdcd8;--cl-accent:#d9822b}
.iso[data-theme="dark"]{--cl-line:#2c2c2c}
.iso-page{margin:0 auto}

.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

.iso{--anatomy-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
.iso{--cl-sat:#d4d4d4;--cl-lcd:#0d0f0d;--cl-lcd-ink:#e6e6e6;--cl-water:#2a2f33;--cl-flow:#ffffff;--cl-tc:#ff6b6b;--cl-screen:#0c0d0c;--cl-trace:#ffffff;--cl-ghost:#6a6a6a;--cl-arabic:"IBM Plex Sans Arabic","Noto Sans Arabic","DejaVu Sans",system-ui,sans-serif}
.iso[data-theme="light"]{--cl-sat:#26262a;--cl-lcd:#e9ebe6;--cl-lcd-ink:#18181a;--cl-water:#cfd6db;--cl-flow:#000000;--cl-tc:#e5484d;--cl-screen:#16171a;--cl-trace:#ffffff;--cl-ghost:#8a8a8f}

/* Arabic card: right-to-left, no letter-spacing (it breaks the joins), the corners mirrored */
.iso-figure{direction:rtl}
.iso-plate-corner{font-family:var(--cl-arabic);letter-spacing:0!important;text-transform:none!important;font-size:11.5px}
.iso-plate-corner[data-corner="fig"]{left:auto;right:0}
.iso-plate-corner[data-corner="title"]{right:auto;left:0}
.iso-plate-corner[data-corner="hint"]{left:auto;right:0}
.iso-plate-corner[data-corner="readout"]{right:auto;left:0;font-variant-numeric:tabular-nums}
.iso-legend{font-family:var(--cl-arabic);font-size:13.5px;line-height:1.75}
.iso-stage,.iso-svg{direction:ltr}

.cl-stage{touch-action:pan-y;outline:none}
.cl-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.cl-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.cl-panel .iso-top,.cl-panel .iso-shade{fill:var(--anatomy-face)}
.cl-lcd{fill:var(--cl-lcd)}
.cl-digits{fill:var(--cl-lcd-ink);font-family:var(--anatomy-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cl-engrave{fill:var(--anatomy-lo);font-family:var(--anatomy-mono);letter-spacing:.12em}
.cl-hole{fill:var(--anatomy-shade-0);stroke:var(--anatomy-lo);stroke-width:.6px;vector-effect:non-scaling-stroke}
.cl-bore{fill:var(--anatomy-shade-0)}
.cl-bed{fill:var(--anatomy-shade-2)}
.cl-sat{opacity:.85}
.cl-grain{fill:none;stroke:var(--anatomy-mid);stroke-width:1.15px;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cl-wall{fill:var(--anatomy-top)}
.cl-tc{fill:none;stroke:var(--cl-tc);stroke-width:.9px;vector-effect:non-scaling-stroke;stroke-linecap:round}
.cl-water .iso-fill,.cl-water .iso-top,.cl-water .iso-shade{fill:var(--cl-water);opacity:.55}
.cl-water .iso-edge{stroke:none}
.cl-flow{fill:none;stroke:var(--cl-flow);stroke-width:.85;stroke-linecap:round;stroke-dasharray:1.2 5.2;opacity:0;transition:opacity .6s var(--anatomy-ease)}
.cl-led circle{transition:opacity .4s var(--anatomy-ease)}
.cl-led:not([data-on]) circle{opacity:.12}
.cl-flow{stroke-dashoffset:calc(var(--o) * 1px - var(--t, 0) * 1px)}
.cl-disp{fill:var(--cl-screen)}
.cl-scr-grid{fill:none;stroke:#ffffff;stroke-opacity:.07;stroke-width:.4px;vector-effect:non-scaling-stroke}
.cl-scr-axis{fill:none;stroke:#ffffff;stroke-opacity:.4;stroke-width:.6px;vector-effect:non-scaling-stroke}
.cl-scr-in{fill:none;stroke:#ffffff;stroke-opacity:.35;stroke-width:.5px;stroke-dasharray:1 1.2;vector-effect:non-scaling-stroke}
.cl-scr-stop{fill:none;stroke:#ffffff;stroke-opacity:.18;stroke-width:.5px;vector-effect:non-scaling-stroke}
.cl-scr-tick{fill:#ffffff;fill-opacity:.45;font-family:var(--anatomy-mono);font-size:2.4px}
.cl-scr-label{fill:#ffffff;fill-opacity:.6;font-family:var(--anatomy-mono);font-size:2.6px;letter-spacing:.04em}
.cl-ghost{fill:none;stroke:#ffffff;stroke-opacity:.32;stroke-width:.8px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.cl-ghost[data-ghost="1"]{stroke-dasharray:1.6 1.4}
.cl-curve{fill:none;stroke:var(--cl-trace);stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.cl-head{fill:var(--cl-trace)}
.cl-print-dot{fill:var(--anatomy-lo)}
.cl-spare{cursor:pointer;transition:opacity .5s var(--anatomy-ease)}
.cl-spare[data-out]{opacity:0}
.cl-bench [data-line] .tb{transition:opacity .6s var(--anatomy-ease)}
.cl-bench[data-running] [data-line]:not([data-on]) .tb{opacity:.55}
.cl-bench [data-line][data-on] .cl-flow{opacity:.95}
.cl-bubble{fill:none;stroke:var(--anatomy-hi);stroke-width:.5px;vector-effect:non-scaling-stroke}


.iso-page{width:min(1080px,100%)}
.cl3-stage{position:relative;outline:none;direction:ltr}
.cl3-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.cl3-canvas{position:relative;width:100%;aspect-ratio:16/9.6;max-width:100%;overflow:hidden;cursor:grab;background:var(--anatomy-card)}
.cl3-canvas:active{cursor:grabbing}
.cl3-canvas canvas{display:block;width:100%;height:100%}
.cl3-canvas[data-hover]{cursor:pointer}
.cl3-tip{position:absolute;pointer-events:none;padding:4px 8px;font:500 12px/1.3 var(--cl-arabic);background:var(--anatomy-card);color:var(--anatomy-strong);box-shadow:0 0 0 1px var(--anatomy-faint);direction:rtl;white-space:nowrap;opacity:0;transition:opacity .15s;z-index:2}
.cl3-tip[data-on]{opacity:1}
.cl3-card{position:absolute;top:12px;right:12px;width:min(340px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;direction:rtl;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-faint),0 8px 24px -12px rgba(0,0,0,.25);padding:14px 16px 12px;font:13px/1.65 var(--cl-arabic);color:var(--anatomy-text);z-index:3}
.cl3-card[hidden]{display:none!important}
.cl3-card h3{margin:0 0 8px;font:600 15px/1.4 var(--cl-arabic);color:var(--anatomy-strong);padding-left:22px;text-wrap:balance}
.cl3-card dl{margin:0;display:grid;gap:6px}
.cl3-card dt{font-weight:600;color:var(--anatomy-strong);font-size:12px}
.cl3-card dd{margin:0}
.cl3-card .cl3-now{margin-top:10px;padding-top:8px;border-top:1px solid var(--anatomy-faint);font-size:12.5px;color:var(--anatomy-strong)}
.cl3-card .cl3-now:empty{display:none}
.cl3-card .cl3-close{position:absolute;top:8px;left:8px;width:24px;height:24px;border:0;background:transparent;color:var(--anatomy-muted);font:18px/1 var(--anatomy-mono);cursor:pointer}
.cl3-tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px;direction:rtl}
.cl3-tools button,.cl3-btn{font:500 12.5px/1 var(--cl-arabic);color:var(--anatomy-text);background:transparent;border:1px solid var(--cl-line);padding:8px 11px;border-radius:2px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.cl3-tools button:hover,.cl3-btn:hover{border-color:var(--anatomy-mid);color:var(--anatomy-strong)}
.cl3-tools button:focus-visible,.cl3-btn:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:2px}
.cl3-tools button[aria-pressed="true"],.cl3-btn[aria-pressed="true"]{background:var(--anatomy-strong);color:var(--anatomy-card);border-color:var(--anatomy-strong)}
.cl3-btn:disabled{opacity:.45;cursor:default}
.cl3-tools .cl3-zoom{font-family:var(--anatomy-mono);min-width:34px;font-size:15px}
.cl3-tools .cl3-sep{width:1px;background:var(--cl-line);margin:0 4px}
.cl3-btn[data-kind="danger"]{color:#c43c3c;border-color:#e2a3a3}
.cl3-panels{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;margin-top:14px;direction:rtl}
.cl3-panel{min-width:0;box-shadow:0 0 0 1px var(--cl-line);padding:12px 14px 14px;background:var(--anatomy-card)}
.cl3-panel h4{margin:0 0 10px;font:600 13px/1.3 var(--cl-arabic);color:var(--anatomy-strong);display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.cl3-panel h4 small{font:400 11px/1.3 var(--anatomy-mono);color:var(--anatomy-muted)}
.cl3-gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cl3-g{min-width:0;padding:7px 9px 8px;box-shadow:0 0 0 1px var(--cl-line)}
.cl3-g span{display:block;font:500 11px/1.35 var(--cl-arabic);color:var(--anatomy-muted)}
.cl3-g b{display:block;margin-top:3px;font:500 14.5px/1.25 "IBM Plex Mono","IBM Plex Sans Arabic",ui-monospace,monospace;color:var(--anatomy-strong);unicode-bidi:plaintext;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl3-g b i{font-style:normal;font-size:11px;color:var(--anatomy-muted);margin-left:3px}
.cl3-g[data-state="warn"]{box-shadow:0 0 0 1px #d9a441;background:color-mix(in srgb,#d9a441 12%,transparent)}
.cl3-g[data-state="bad"]{box-shadow:0 0 0 1px #d64545;background:color-mix(in srgb,#d64545 12%,transparent)}
.cl3-g[data-state="good"] b{color:#2f8f57}
.cl3-phases{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.cl3-ph{min-width:0;padding:7px 7px 9px;box-shadow:0 0 0 1px var(--cl-line);position:relative;overflow:hidden}
.cl3-ph b{display:block;font:600 11.5px/1.3 var(--cl-arabic);color:var(--anatomy-strong)}
.cl3-ph span{display:block;font:400 10.5px/1.45 var(--cl-arabic);color:var(--anatomy-muted)}
.cl3-ph i{position:absolute;inset:auto 0 0 0;height:3px;background:var(--cl-accent);transform-origin:right;transform:scaleX(0)}
.cl3-ph[data-on]{box-shadow:0 0 0 1.5px var(--cl-accent)}
.cl3-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cl3-records{list-style:none;margin:0;padding:0;display:grid;gap:5px;max-height:260px;overflow:auto}
.cl3-records li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:7px 9px;box-shadow:0 0 0 1px var(--cl-line);font:12px/1.5 var(--cl-arabic)}
.cl3-records li b{font:600 12px/1.5 var(--anatomy-mono);color:var(--anatomy-strong)}
.cl3-records li code{grid-column:1/-1;font:10.5px/1.5 var(--anatomy-mono);color:var(--anatomy-muted);direction:ltr;text-align:right;overflow-wrap:anywhere}
.cl3-records li em{font-style:normal;font-weight:600;white-space:nowrap}

<script>(() => {
// C-LAYER truth model. Pure functions, shared by the build and the page.
// Every number comes from the project proposal (sections 6, 11 and 2):
//   feed 0.10 L/min at 0 °C, 15 % CO2 in N2, RH ≈ 2 %; CO2 in = 0.10 × 0.15 / 22.414 = 0.669 mmol/min
//   bed 2.5 g in a 12 mm stainless tube, about 50 mm deep; adsorb at 40 °C; regenerate at 90–100 °C in N2
//   planning capacity 1.0–1.5 mmol/g, so stoichiometric time 3.7–5.6 min; a full curve takes 8–12 min
//   published loss of a PEI-silica after cumulative SO2 exposure of 10, 50 and 200 ppm: 18, 61 and 89 %

const FEED = { flow: 0.1, yIn: 0.15, molar: 22.414 };
const CO2_IN = (FEED.flow * FEED.yIn * 1000) / FEED.molar; // mmol/min = 0.669
const MASS = 2.5; // g
const BED_MM = 50;
const Q_FRESH = 1.25; // mmol/g, middle of the 1.0–1.5 planning range
const DEAD = 0.25; // min, dead volume to the sensor (removed by the blank run)
const STOP = 0.9; // a curve runs until the outlet reaches 90 % of the inlet

const CARTRIDGES = [
  { id: "fresh", loss: 0, so2: 0 },
  { id: "so2-10", loss: 0.18, so2: 10 },
  { id: "so2-50", loss: 0.61, so2: 50 },
  { id: "so2-200", loss: 0.89, so2: 200 },
];

// Phases of one cycle (section 6). minutes are the plan's figures; rate is sim minutes per real second.
const PHASES = [
  { id: "purge", v2: "purge", v1: "cart", t0: 95, t1: 95, minutes: 12, rate: 4.5 },
  { id: "cool", v2: "purge", v1: "cart", t0: 95, t1: 40, minutes: 5, rate: 2.2 },
  { id: "inlet", v2: "feed", v1: "bypass", t0: 40, t1: 40, minutes: 2, rate: 1.1 },
  { id: "adsorb", v2: "feed", v1: "cart", t0: 40, t1: 40, minutes: null, rate: 0.95 },
  { id: "regen", v2: "purge", v1: "cart", t0: 40, t1: 95, minutes: 10, rate: 3.2 },
  { id: "seal", v2: "off", v1: "cart", t0: 95, t1: 95, minutes: 0.2, rate: 0.12 },
];

const capacityOf = (cart) => Q_FRESH * (1 - cart.loss);
const stoichOf = (cart) => (MASS * capacityOf(cart)) / CO2_IN; // min

// Mass-transfer zone: a constant-pattern front of width set by the fresh bed (about a third of its stoichiometric time).
const SPREAD = 0.3 * ((MASS * Q_FRESH) / CO2_IN);

const erf = (x) => {
  const s = Math.sign(x);
  const a = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * a);
  const y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a);
  return s * y;
};
const phi = (x) => 0.5 * (1 + erf(x / Math.SQRT2));

// Fraction of the CO2 fed that leaves the bed, at minutes t after feed starts. A front of
// cumulative-normal shape is shifted so the area above it equals the bed's true uptake.
function breakthrough(cart, t) {
  const ts = stoichOf(cart);
  const s = Math.min(SPREAD, ts * 0.55);
  const x = t - DEAD - ts;
  return t <= DEAD ? 0 : Math.max(0, Math.min(1, (phi(x / s) - phi((-ts) / s)) / (1 - phi(-ts / s))));
}

// What the NDIR reads: the outlet mole fraction. N2 is conserved, so y = f·yIn / (1 − yIn + f·yIn).
const outletOf = (f) => (f * FEED.yIn) / (1 - FEED.yIn + f * FEED.yIn);

// Minutes until the sensor reads 90 % of the inlet concentration.
function stopTime(cart) {
  let lo = 0, hi = 60;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (outletOf(breakthrough(cart, mid)) >= STOP * FEED.yIn) hi = mid;
    else lo = mid;
  }
  return hi;
}

// Capacity integrated from the curve with the N2 balance: uptake rate = CO2 in − N2 · y / (1 − y).
function uptake(cart, t, dt = 0.02) {
  let sum = 0;
  const n2 = CO2_IN * (1 - FEED.yIn) / FEED.yIn;
  for (let s = DEAD; s < t; s += dt) {
    const y = outletOf(breakthrough(cart, s + dt / 2));
    sum += (CO2_IN - (n2 * y) / (1 - y)) * Math.min(dt, t - s);
  }
  return sum / MASS; // mmol/g
}

// Saturation along the bed (0 at the inlet, 1 at the outlet): the same front, read in space.
function saturation(cart, t, z) {
  const ts = stoichOf(cart);
  const s = Math.min(SPREAD, ts * 0.55);
  const front = (t - DEAD) / ts; // bed lengths swept
  return 1 - phi((z - front) / (s / ts));
}
// C-Layer bench in 3D, working. World coordinates are the drawing's (x along the gas line, y out of the panel,

const NAMES = { purge: "تنظيف أولي", cool: "تبريد", inlet: "قياس الدخول", adsorb: "امتصاص", regen: "استرجاع", seal: "حساب وختم" };

// ===================== the sealed data layer =====================
const records = [];
let keyPair = null;
const enc = new TextEncoder();
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
const canon = (o) => JSON.stringify(o, Object.keys(o).sort());
async function sha(text) {

(async () => { try { keyPair = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, false, ["sign", "verify"]); } catch { keyPair = null; } })();
function resultOf(slot) {
  const list = sim.results[slot];
  if (!list.length) return null;
  const mean = list.reduce((a, b) => a + b, 0) / list.length;
  const sd = list.length > 1 ? Math.sqrt(list.reduce((a, b) => a + (b - mean) ** 2, 0) / (list.length - 1)) : 0;
  return { mean, err: Math.max(sd, 0.03 * mean, 0.01), n: list.length };
}
async function sealRecord() {
  sealing = true;
  const q = qNet();
  if (sim.blank) sim.blankArea = sim.qSoft;
  else sim.results[sim.slot].push(q);
  const res = sim.blank ? null : resultOf(sim.slot);
  const prev = records.length ? records[records.length - 1].hash : "0".repeat(64);
  const content = {
    n: records.length + 1,
    cartridge: sim.blank ? "BLANK" : `slot-${sim.slot + 1}`,
    time: new Date().toISOString(),
    operator: "C-Layer team",
    feed: "15% CO2 / 85% N2, 0.10 L/min, RH 2%",
    mass_g: sim.blank ? 0 : MASS,
    temp_c: 40,
    heating_no: sim.blank ? 0 : sim.heatings[sim.slot],
    calibration: { inlet_raw_pct: +(sim.cinRaw * 100).toFixed(3), blank_mmol_g: sim.blankArea === null ? null : +sim.blankArea.toFixed(4) },
    raw_points: sim.curve.length,
    curve: sim.curve.filter((_, i) => i % 4 === 0).map(([t, y]) => [+t.toFixed(2), +(y * 100).toFixed(2)]),
    capacity_mmol_g: sim.blank ? null : +q.toFixed(3),
    error_mmol_g: res ? +res.err.toFixed(3) : null,
    prev,
  };

  try { if (keyPair) sig = hex(await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, keyPair.privateKey, enc.encode(hash))); } catch { sig = null; }

  records.push({ content, stored: JSON.parse(JSON.stringify(content)), hash, sig, tsa, ok: true, why: "" });
  sealing = false;
  await verifyAll(false);

}

    const h = await sha(canon(r.stored));
    const prevOk = r.stored.prev === (i ? records[i - 1].hash : "0".repeat(64));
    let sigOk = true;
    try { if (keyPair && r.sig) sigOk = await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, keyPair.publicKey, unhex(r.sig), enc.encode(r.hash)); } catch { sigOk = false; }

    else if (!prevOk || !sigOk) { r.ok = false; r.why = !prevOk ? "الرابط بالسجل السابق مكسور" : "التوقيع غير صالح"; broken = true; }
    else if (broken) { r.ok = false; r.why = "يأتي بعد سجل مكسور في السلسلة"; }

  }
  if (announce) {
    renderRecords();
    $("[data-chain]").textContent = !records.length ? "لا سجلات بعد." : broken ? "انكشف التلاعب: البصمة المحفوظة لم تعد تطابق المحتوى، فالسلسلة مكسورة من السجل المعدّل وما بعده." : `السلسلة سليمة: ${ar(records.length)} سجل، كل بصمة وتوقيع ورابط صحيح.`;
  }

}
function renderRecords() {
  const ul = $("[data-records]");

  ul.innerHTML = records.slice().reverse().map((r) => {
    const c = r.stored;
    const who = c.cartridge === "BLANK" ? "تشغيل فارغ" : `خرطوشة ${ar(c.cartridge.split("-")[1])}`;
    const val = c.capacity_mmol_g === null ? `تصحيح ${ltr((c.calibration.blank_mmol_g ?? 0).toFixed(3) + " mmol/g")}` : ltr(`${c.capacity_mmol_g.toFixed(3)} ± ${(c.error_mmol_g ?? 0).toFixed(3)} mmol/g`);
    return `<li data-ok="${r.ok ? 1 : 0}"><b>#${c.n}</b><span>${who} · ${val} · تسخين ${ar(c.heating_no)}</span><em>${r.ok ? "✓ سليم" : "✗ " + r.why}</em><code>sha256 ${r.hash.slice(0, 16)}… ← prev ${c.prev.slice(0, 10)}… · sig ${r.sig ? r.sig.slice(0, 12) + "…" : "—"} · tsa ${r.tsa.slice(0, 8)}… · ${c.time.slice(11, 19)}</code></li>`;
  }).join("");
}

const anim = { cover: 1, coverLift: 0, block: 0, door: 0 };

    const f = cartridgeModel(which);
